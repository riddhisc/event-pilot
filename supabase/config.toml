# Local Supabase project file. `npm run dev` does not need Docker or this CLI.
# Apply these files with `supabase start` (Docker) or `supabase db push` against a cloud project.

project_id = "eventbuddy"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5175"
additional_redirect_urls = ["http://localhost:5175"]

# Login, password reset, and the custom access-token hook are on hold.
# Do not put a service-role key in any VITE_ variable.

[auth.external.google]
enabled = false

[auth.external.azure]
enabled = false
